services:
  technitium:
    image: technitium/dns-server:latest
    container_name: technitium
    restart: unless-stopped

    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp"

      # Web admin console
      - "5380:5380/tcp"

    volumes:
      - ./config:/etc/dns

    networks:
      - proxy

networks:
  proxy:
    external: true
